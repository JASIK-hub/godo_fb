openapi: 3.0.3
info:
  title: Video Analysis API
  version: 1.2.0
  description: |
    Upload completes before 202; inference runs in the background. Poll until done or failed.
    Jobs persist in local SQLite and expire after 1 hour by default.
    Interrupted jobs become failed after restart and are never automatically replayed.
    Total job deadline is at most 300 seconds, including upload and queue wait.
    Video decoding and duration checks run in the worker; invalid video produces failed.
    Deploy one backend instance. Queue saturation returns 503. Files are limited to 100 MiB
    by default; supported declared MIME types are video/mp4, video/webm, video/quicktime.
    Public API credentials must never be embedded in frontend assets. Browser access requires a separately agreed integration.
servers:
  - url: /
security:
  - ApiKey: []
paths:
  /api/v1/analyze:
    post:
      operationId: analyze
      summary: Submit a video
      requestBody:
        $ref: '#/components/requestBodies/Video'
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { description: File too large }
        '415': { description: Unsupported video MIME type }
        '503': { description: Job capacity exhausted; retry later }
  /api/v1/jobs/{job_id}:
    get:
      operationId: getJob
      summary: Read analysis status
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200': { $ref: '#/components/responses/Job' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: Job missing or expired }
components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: Server-side JURY_API_KEY. Required on both public machine endpoints; never embed in frontend assets.
  parameters:
    JobId:
      name: job_id
      in: path
      required: true
      schema: { type: string, format: uuid }
  requestBodies:
    Video:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required: [file]
            properties:
              file: { type: string, format: binary }
  responses:
    Accepted:
      description: Queued for background analysis
      content:
        application/json:
          schema:
            type: object
            required: [job_id]
            properties:
              job_id: { type: string, format: uuid }
    Job:
      description: Current job state
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/ProcessingJob'
              - $ref: '#/components/schemas/DoneJob'
              - $ref: '#/components/schemas/FailedJob'
            discriminator:
              propertyName: status
              mapping:
                processing: '#/components/schemas/ProcessingJob'
                done: '#/components/schemas/DoneJob'
                failed: '#/components/schemas/FailedJob'
    BadRequest: { description: 'Missing, empty, or invalid multipart file' }
    Unauthorized: { description: Missing or invalid credentials }
  schemas:
    ProcessingJob:
      type: object
      required: [job_id, status]
      properties:
        job_id: { type: string, format: uuid }
        status: { type: string, enum: [processing] }
    DoneJob:
      type: object
      required: [job_id, status, verdict, violations, source]
      properties:
        job_id: { type: string, format: uuid }
        status: { type: string, enum: [done] }
        verdict: { type: string, enum: [pass, fail] }
        violations:
          type: array
          items: { $ref: '#/components/schemas/Violation' }
        source:
          type: string
          enum: [ml, stub]
          description: UI must visibly identify stub results as demo data.
    FailedJob:
      type: object
      required: [job_id, status, error]
      properties:
        job_id: { type: string, format: uuid }
        status: { type: string, enum: [failed] }
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, enum: [ML_UNAVAILABLE, ML_INVALID_RESPONSE, INVALID_VIDEO, DEADLINE_EXCEEDED, PROCESS_INTERRUPTED] }
            message: { type: string }
    Violation:
      type: object
      required: [code, message, timestamp_seconds]
      properties:
        code:
          type: string
          description: Rule identifier supplied and verified by ML against its regulatory catalog.
        message:
          type: string
          description: ML-provided violation description including its normative source, preserved verbatim.
        timestamp_seconds: { type: number, minimum: 0 }
